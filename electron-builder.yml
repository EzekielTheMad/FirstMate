appId: com.firstmate.app
productName: FirstMate
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: EzekielTheMad
  repo: FirstMate
  releaseType: release
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build/installer.nsh
