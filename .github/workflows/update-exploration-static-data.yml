name: Update EVE exploration data

on:
  schedule:
    # Weekly, after the normal Wednesday Tranquility downtime window.
    - cron: '30 13 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-eve-exploration-data
  cancel-in-progress: false

jobs:
  validate:
    # Always validate trusted default-branch code, including manual dispatches.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.latest.outputs.changed }}
      latest: ${{ steps.latest.outputs.latest }}
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record validated base
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check CCP's latest SDE build
        id: latest
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://developers.eveonline.com/static-data/tranquility/latest.jsonl \
            --output "$RUNNER_TEMP/latest.jsonl"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { readBuild } from './scripts/ci/prepare-exploration-update.mjs'
          const rows = readFileSync(`${process.env.RUNNER_TEMP}/latest.jsonl`, 'utf8').trim().split(/\r?\n/).map(JSON.parse)
          const row = rows.find(row => row._key === 'sde')
          const latest = readBuild({ source: { buildNumber: row?.buildNumber ?? row?._value ?? row?.value } })
          const bundled = readBuild(JSON.parse(readFileSync('src/shared/data/exploration-static.json', 'utf8')))
          appendFileSync(process.env.GITHUB_OUTPUT, `latest=${latest}\nchanged=${latest !== bundled}\n`)
          if (latest === bundled) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Bundled EVE data is current (SDE build ${bundled}). No branch or PR changes.\n`)
          NODE

      - name: Download current official SDE
        if: steps.latest.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p .tmp/sde
          curl --fail --silent --show-error --location --retry 3 --max-time 900 \
            https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip \
            --output "$RUNNER_TEMP/eve-sde.zip"
          unzip -q "$RUNNER_TEMP/eve-sde.zip" -d .tmp/sde

      - name: Regenerate compact offline exploration data
        if: steps.latest.outputs.changed == 'true'
        run: node scripts/generate-exploration-static-data.mjs .tmp/sde src/shared/data/exploration-static.json

      - name: Check downloaded SDE build
        if: steps.latest.outputs.changed == 'true'
        env:
          LATEST_BUILD: ${{ steps.latest.outputs.latest }}
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {readBuild} from './scripts/ci/prepare-exploration-update.mjs'; if (readBuild(JSON.parse(readFileSync('src/shared/data/exploration-static.json'))) !== process.env.LATEST_BUILD) throw new Error('CCP SDE changed during download; rerun the workflow')"

      - name: Validate generated data
        if: steps.latest.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Save validated data
        if: steps.latest.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: validated-exploration-data
          path: src/shared/data/exploration-static.json
          if-no-files-found: error
          retention-days: 7

  publish-branch:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access is isolated from dependency installation and test execution.
    permissions:
      contents: write
    steps:
      - name: Checkout validated base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0

      - name: Download validated data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: validated-exploration-data
          path: ${{ runner.temp }}/validated-exploration-data

      - name: Prepare update branch and manual review link
        env:
          UPDATE_ARTIFACT: ${{ runner.temp }}/validated-exploration-data/exploration-static.json
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          LATEST_BUILD: ${{ needs.validate.outputs.latest }}
        run: node scripts/ci/prepare-exploration-update.mjs
