name: Release

# Build the Windows installer on a real Windows runner and attach it to a
# GitHub Release. Triggered by pushing a version tag, e.g. `v0.1.0`.
on:
  push:
    tags:
      - 'v*'
  # Allow building on demand from the Actions tab (produces artifacts, no release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main + preload
        run: npm run build

      - name: Build installer (and publish on tag)
        run: npx --no-install electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: FirstMate-Windows-Installer
          path: dist/*-setup.exe
          if-no-files-found: warn
