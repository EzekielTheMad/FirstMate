name: Release

# Tag pushes publish only after validation. Manual runs only create artifacts,
# even when a tag is selected in the Actions UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml

  windows:
    needs: secrets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate version and release notes before packaging
        shell: bash
        run: node scripts/ci/prepare-release.mjs notes > "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer + main + preload
        run: npm run build

      - name: Build installer without publishing
        run: npx --no-install electron-builder --win --publish never

      - name: Verify expected release assets and compute checksums
        shell: bash
        run: |
          node scripts/ci/prepare-release.mjs checksums "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/RELEASE_NOTES.md" "$RUNNER_TEMP/release-assets/RELEASE_NOTES.md"

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: FirstMate-Windows-Installer
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish. It does not install or execute app dependencies.
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: FirstMate-Windows-Installer
          path: release

      - name: Verify artifact checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish complete release from tag
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # Create a draft first so failed uploads do not expose a partial release.
          # A published release is deliberately never overwritten on a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > is-draft.txt; then
            if [ "$(cat is-draft.txt)" != true ]; then
              echo 'This release is already published. Review it manually instead of replacing its assets.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          # Only upload files whose checksums were verified above, plus the manifest.
          mapfile -t assets < <(sed 's/^[a-f0-9]\{64\}  //' SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --clobber
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --prerelease="$prerelease" --draft=false
