name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets with pinned Gitleaks
        run: bash scripts/ci/scan-secrets.sh
